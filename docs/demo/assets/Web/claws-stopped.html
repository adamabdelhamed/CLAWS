<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLAWS Stopped</title>
</head>
<body style="margin:0;background:#000;overflow:hidden">
<div id="claws-stopped" style="position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;background:#000;color:white;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:Consolas,Menlo,Monaco,'Courier New',monospace;user-select:none;-webkit-user-select:none;touch-action:none">
  <style>
    #claws-stopped,#claws-stopped *{box-sizing:border-box}
    #claws-stopped .stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;background:radial-gradient(circle at 35% 50%,rgba(0,90,255,.25),transparent 31%),radial-gradient(circle at 66% 50%,rgba(255,80,0,.27),transparent 32%),#000}
    #claws-stopped .energy{position:absolute;inset:-30%;background:linear-gradient(90deg,transparent,rgba(0,120,255,.32),transparent 48%,rgba(255,80,0,.36),transparent);filter:blur(18px);animation:claws-drift 5s ease-in-out infinite alternate}
    #claws-stopped .panel{position:relative;width:min(96vw,900px);min-height:min(70dvh,520px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));box-shadow:0 0 56px rgba(0,110,255,.18),0 0 56px rgba(255,80,0,.15),inset 0 0 44px rgba(255,255,255,.035);overflow:hidden;text-align:center}
    #claws-stopped .panel:before{content:"";position:absolute;inset:-40px;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle,black 22%,transparent 72%);animation:claws-grid 3s linear infinite}
    #claws-stopped .title{position:relative;font-size:clamp(24px,6vw,58px);font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px rgba(0,110,255,.45),0 0 18px rgba(255,80,0,.42)}
    #claws-stopped .message{position:relative;max-width:720px;text-align:center;font-size:clamp(13px,2.2vw,18px);line-height:1.7;color:rgba(255,255,255,.78);margin-top:8px}
    #claws-stopped .button{position:relative;margin-top:34px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:14px 30px;font:800 15px Consolas,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,rgba(0,105,255,.55),rgba(255,92,0,.58));box-shadow:0 0 22px rgba(0,110,255,.24),0 0 26px rgba(255,80,0,.22);cursor:pointer;transition:opacity .2s,filter .2s,transform .2s}
    #claws-stopped .button:hover{transform:translateY(-1px)}
    @keyframes claws-drift{from{transform:translateX(-5%) rotate(-2deg)}to{transform:translateX(5%) rotate(2deg)}}
    @keyframes claws-grid{to{transform:translateY(22px)}}
  </style>
  <div class="stage">
    <div class="energy"></div>
    <div class="panel">
      <div class="title">CLAWS</div>
      <div class="message">The demo has ended. Refresh the page to start a new browser process and launch CLAWS again.</div>
      <button type="button" class="button" data-klooie-refresh>Refresh Demo</button>
    </div>
  </div>
</div>
</body>
</html>
